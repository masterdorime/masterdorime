  <rect x="1" y="1" width="818.00" height="503.47" rx="16" fill="url(#bloom)"/>
  <rect x="1" y="1" width="818.00" height="503.47" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.4"/>
  <rect x="1" y="1" width="818.00" height="503.47" rx="16" fill="none" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.4" filter="url(#soft)"/>

