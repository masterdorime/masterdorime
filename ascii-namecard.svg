  <text class="info k-head" x="44" y="196.81" style="font-size:10.4px; animation:i0 18s linear infinite">SYSTEM INFORMATION</text>
  <text class="info k-field" x="44" y="213.66" style="font-size:10.4px; animation:i1 18s linear infinite">USER         : Tristan Edgina</text>
  <text class="info k-field" x="44" y="225.72" style="font-size:10.4px; animation:i2 18s linear infinite">UNIVERSITY   : Telkom University</text>
  <text class="info k-field" x="44" y="237.79" style="font-size:10.4px; animation:i3 18s linear infinite">MAJOR        : Computer Engineering</text>
  <text class="info k-field" x="44" y="249.85" style="font-size:10.4px; animation:i4 18s linear infinite">GRADUATION   : 2030 (EXPECTED)</text>
  <text class="info k-head" x="44" y="261.92" style="font-size:10.4px; animation:i5 18s linear infinite">TECHNICAL INTERESTS</text>
  <text class="info k-plain" x="44" y="278.96" style="font-size:10.6px; animation:i6 18s linear infinite">&gt; Artificial Intelligence</text>
  <text class="info k-plain" x="44" y="291.68" style="font-size:10.6px; animation:i7 18s linear infinite">&gt; Robotics &amp; Embedded Systems</text>
  <text class="info k-plain" x="44" y="304.40" style="font-size:10.6px; animation:i8 18s linear infinite">&gt; Full-Stack Development</text>
  <text class="info k-plain" x="44" y="317.12" style="font-size:10.6px; animation:i9 18s linear infinite">&gt; Hardware / Software Integration</text>
  <text class="info k-head" x="44" y="329.64" style="font-size:10.4px; animation:i10 18s linear infinite">CURRENT BUILDS</text>
  <text class="info k-entry" x="44" y="347.09" style="font-size:11px; animation:i11 18s linear infinite">[01] HOBYD</text>
  <text class="info k-desc" x="44" y="361.91" style="font-size:10.2px; animation:i12 18s linear infinite">     Live Auction Marketplace</text>
  <text class="info k-entry" x="44" y="374.54" style="font-size:11px; animation:i13 18s linear infinite">[02] H2ORIZON</text>
  <text class="info k-desc" x="44" y="389.36" style="font-size:10.2px; animation:i14 18s linear infinite">     Smart Water Bottle</text>
