  <g id="scan" style="animation:scan 18s steps(84) infinite, scanFade 18s linear infinite">
    <rect x="30" y="64" width="15.38" height="78.41" fill="#2dd4bf" fill-opacity="0.07"/>
    <rect x="30" y="64" width="1.4" height="78.41" fill="#7ff5e4" fill-opacity="0.7"/>
