<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820.00 505.47" width="820" height="505" xml:space="preserve" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Tristan Edgina - animated ASCII name card</title>
  <desc id="dsc">The name TRISTAN EDGINA drawn as large teal ASCII glyphs on a dark terminal panel, typing itself out left to right. Below it a shell prompt prints a whoami report: USER is Tristan Edgina; UNIVERSITY is Telkom University; MAJOR is Computer Engineering; GRADUATION is 2030 (EXPECTED). current builds: HOBYD, H2ORIZON, UROCHECK, PURESIP.</desc>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; white-space: pre; }
    .name { font-size: 15.079365079365079px; fill: url(#gain); }
    .info { font-size: 12.4px; fill: #7fe7d6; fill-opacity: 0.86; }
    .k-head  { fill: #5eead4; fill-opacity: 0.95; letter-spacing: 1.4px; }
    .k-field { fill: #7fe7d6; fill-opacity: 0.80; }
    .k-entry { fill: #5eead4; fill-opacity: 0.95; }
    .k-desc  { fill: #a8b6c4; fill-opacity: 0.72; }
    .k-plain { fill: #a8b6c4; fill-opacity: 0.80; }
    .prompt { font-size: 12.4px; fill: #5eead4; }
    @keyframes wipeInA{0%{clip-path:inset(0 100% 0 0)}14.444%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
    @keyframes wipeInB{0%{clip-path:inset(0 100% 0 0)}14.444%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
    @keyframes frameA{0%,71.111%{opacity:1}75%{opacity:0}95.556%{opacity:0}99.444%,100%{opacity:1}}
    @keyframes frameB{0%,71.111%{opacity:0}75%{opacity:1}95.556%{opacity:1}99.444%,100%{opacity:0}}
    @keyframes scan{0%{transform:translateX(0px)}14.444%{transform:translateX(750.95px)}100%{transform:translateX(750.95px)}}
    @keyframes scanFade{0%{opacity:1}14.444%{opacity:1}16.667%{opacity:0}100%{opacity:0}}
    @keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes i0{0%,16.111%{opacity:0}17.778%{opacity:1}100%{opacity:1}}
    @keyframes i1{0%,18.444%{opacity:0}20.111%{opacity:1}100%{opacity:1}}
    @keyframes i2{0%,20.778%{opacity:0}22.444%{opacity:1}100%{opacity:1}}
    @keyframes i3{0%,23.111%{opacity:0}24.778%{opacity:1}100%{opacity:1}}
    @keyframes i4{0%,25.444%{opacity:0}27.111%{opacity:1}100%{opacity:1}}
    @keyframes i5{0%,27.778%{opacity:0}29.444%{opacity:1}100%{opacity:1}}
    @keyframes i6{0%,30.111%{opacity:0}31.778%{opacity:1}100%{opacity:1}}
    @keyframes i7{0%,32.444%{opacity:0}34.111%{opacity:1}100%{opacity:1}}
    @keyframes i8{0%,34.778%{opacity:0}36.444%{opacity:1}100%{opacity:1}}
    @keyframes i9{0%,37.111%{opacity:0}38.778%{opacity:1}100%{opacity:1}}
    @keyframes i10{0%,39.444%{opacity:0}41.111%{opacity:1}100%{opacity:1}}
    @keyframes i11{0%,41.778%{opacity:0}43.444%{opacity:1}100%{opacity:1}}
    @keyframes i12{0%,44.111%{opacity:0}45.778%{opacity:1}100%{opacity:1}}
    @keyframes i13{0%,46.444%{opacity:0}48.111%{opacity:1}100%{opacity:1}}
    @keyframes i14{0%,48.778%{opacity:0}50.444%{opacity:1}100%{opacity:1}}
    @keyframes i15{0%,51.111%{opacity:0}52.778%{opacity:1}100%{opacity:1}}
    @keyframes i16{0%,53.444%{opacity:0}55.111%{opacity:1}100%{opacity:1}}
    @keyframes i17{0%,55.778%{opacity:0}57.444%{opacity:1}100%{opacity:1}}
    @keyframes i18{0%,58.111%{opacity:0}59.778%{opacity:1}100%{opacity:1}}
    @keyframes i19{0%,60.444%{opacity:0}62.111%{opacity:1}100%{opacity:1}}
    @keyframes i20{0%,62.778%{opacity:0}64.444%{opacity:1}100%{opacity:1}}
    @media (prefers-reduced-motion: reduce) {
      #frameA_wipe, #frameB_wipe { animation: none !important; clip-path: none !important; }
      #frameA { animation: none !important; opacity: 1 !important; }
      #frameB { animation: none !important; opacity: 0 !important; }
      #scan   { animation: none !important; opacity: 0 !important; }
      .info   { animation: none !important; opacity: 1 !important; }
      #caretBar { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <defs>
    <linearGradient id="gain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#38d9c8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.1" fill="#000" fill-opacity="0.15"/>
    </pattern>
  </defs>

