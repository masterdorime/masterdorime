<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1212.30 334.00" width="1212" height="334" xml:space="preserve" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Tristan Edgina - animated ASCII name card</title>
  <desc id="dsc">The name TRISTAN EDGINA drawn as large teal ASCII glyphs on a dark terminal panel, typing itself out left to right. Below it a shell prompt prints the personal details: Computer Engineering Student at Telkom University, AI, Robotics, Embedded Systems and Game Dev.</desc>

  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; white-space: pre; }
    .name { font-size: 25px; fill: url(#gain); }
    .info { font-size: 13.2px; fill: #7fe7d6; fill-opacity: 0.86; }
    .prompt { font-size: 13.2px; fill: #5eead4; }
    @keyframes wipeInA{0%{clip-path:inset(0 100% 0 0)}20%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
    @keyframes wipeInB{0%{clip-path:inset(0 100% 0 0)}20%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 0)}}
    @keyframes frameA{0%,56.25%{opacity:1}60.625%{opacity:0}83.75%{opacity:0}88.125%,100%{opacity:1}}
    @keyframes frameB{0%,56.25%{opacity:0}60.625%{opacity:1}83.75%{opacity:1}88.125%,100%{opacity:0}}
    @keyframes scan{0%{transform:translateX(0px)}20%{transform:translateX(1145.40px)}100%{transform:translateX(1145.40px)}}
    @keyframes scanFade{0%{opacity:1}20%{opacity:1}22.5%{opacity:0}100%{opacity:0}}
    @keyframes caretBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes i0{0%,22.5%{opacity:0}24.375%{opacity:1}100%{opacity:1}}
    @keyframes i1{0%,25.313%{opacity:0}27.187%{opacity:1}100%{opacity:1}}
    @keyframes i2{0%,28.125%{opacity:0}30%{opacity:1}100%{opacity:1}}
    @media (prefers-reduced-motion: reduce) {
      #frameA { animation: none !important; opacity: 1 !important; clip-path: none !important; }
      #frameB { animation: none !important; opacity: 0 !important; clip-path: none !important; }
      #scan   { animation: none !important; opacity: 0 !important; }
      .info   { animation: none !important; opacity: 1 !important; }
      #caretBar { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <defs>
    <linearGradient id="gain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.55" stop-color="#38d9c8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1.1" fill="#000" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1210.30" height="332.00" rx="16" fill="#080e16"/>
  <rect x="1" y="1" width="1210.30" height="332.00" rx="16" fill="url(#bloom)"/>
  <rect x="1" y="1" width="1210.30" height="332.00" rx="16" fill="none" stroke="url(#edge)" stroke-width="1.4"/>
  <rect x="1" y="1" width="1210.30" height="332.00" rx="16" fill="none" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.4" filter="url(#soft)"/>

  <g>
    <circle cx="36" cy="40" r="4.6" fill="#f87171" fill-opacity="0.85"/>
    <circle cx="52" cy="40" r="4.6" fill="#fbbf24" fill-opacity="0.85"/>
    <circle cx="68" cy="40" r="4.6" fill="#34d399" fill-opacity="0.85"/>
  </g>
  <line x1="30" y1="52" x2="1182.30" y2="52" stroke="#2dd4bf" stroke-opacity="0.22" stroke-width="1"/>

  <g>
  <g id="frameA" style="animation-name:wipeInA,frameA; animation-duration:16s,16s; animation-timing-function:linear,linear; animation-iteration-count:infinite,infinite">
    <text x="30" y="83.76" textLength="1152.30" lengthAdjust="spacingAndGlyphs"> """"""""""" '"""""""    ."""""""""    '""""".  .""""""""""'    """"     """".  ""'              """"""""""  """"""'       ."""""'   """""""""   """"  ."".    .""".   </text>
    <text x="30" y="109.76" textLength="1152.30" lengthAdjust="spacingAndGlyphs"> ~~~~@@#~~~: ~@@+~~~#@*' '~~~@@*~~:  '%@*~~~++" '~~~+@@+~~~"   :@%%@:    =@%%*  #@+              =@@~~~~~~~  @@*~~-#@=, .+%%-~~~~=:  :~~#@@~~~. .@@#@; "@@,   .*@#@*.  </text>
    <text x="30" y="135.76" textLength="1152.30" lengthAdjust="spacingAndGlyphs">     @@+     ~@@;",;*@*'     @@~     .~*@=-;".      "@@:      :@@,"@@:   =@*"%+ #@+              =@@~~~~~'   @@-    +@@"=@@. ."""""     =@@     .@@~~@""@@,  .*@* +@*. </text>
    <text x="30" y="161.76" textLength="1152.30" lengthAdjust="spacingAndGlyphs">     @@+     ~@@;,:%@=.      @@~         '"~@@-     "@@:     :@@#~~*@@:  =@* :@:#@+              =@@""""".   @@-   '*@%'~@@~.'~~%@=     =@@     .@@~ =%:@@, .*@@-~-@@*.</text>
    <text x="30" y="187.76" textLength="1152.30" lengthAdjust="spacingAndGlyphs">     ==~     :=='  .+==' '~~~==+~~:  ;=**=**=+"     "==,    "==;    ;==" -=-  ~===;              -==~~~~~~~  =======+:.  "-=*#==#=-  :~~===~~~. .==: .====" ~==.   .==-</text>
  </g>
  <g id="frameB" style="animation-name:wipeInB,frameB; animation-duration:16s,16s; animation-timing-function:linear,linear; animation-iteration-count:infinite,infinite">
    <text x="30" y="83.76" textLength="1152.30" lengthAdjust="spacingAndGlyphs"> ;;;;;;;;;;; :;;;;;;;    ,;;;;;;;;;    :;;;;;,  ,;;;;;;;;;;:    ;;;;     ;;;;,  ;;:              ;;;;;;;;;;  ;;;;;;:       ,;;;;;:   ;;;;;;;;;   ;;;;  ,;;,    ,;;;,   </text>
    <text x="30" y="109.76" textLength="1152.30" lengthAdjust="spacingAndGlyphs"> ====@@@===- =@@#===@@@: :===@@@==-  :@@@===##; :===#@@#===;   -@@@@-    %@@@@  @@#              %@@=======  @@@==*@@%~ ,#@@*====%-  -==@@@===, ,@@@@+ ;@@~   ,@@@@@,  </text>
    <text x="30" y="135.76" textLength="1152.30" lengthAdjust="spacingAndGlyphs">     @@#     =@@+;~+@@@:     @@=     ,=@@%*+;,      ;@@-      -@@~;@@-   %@@;@# @@#              %@@=====:   @@*    #@@;%@@, ,;;;;;     %@@     ,@@==@;;@@~  ,@@@ #@@, </text>
    <text x="30" y="161.76" textLength="1152.30" lengthAdjust="spacingAndGlyphs">     @@#     =@@+~-@@%,      @@=         :;=@@*     ;@@-     -@@@==@@@-  %@@ -@-@@#              %@@;;;;;,   @@*   :@@@:=@@=,:==@@%     %@@     ,@@= %@-@@~ ,@@@*=*@@@,</text>
    <text x="30" y="187.76" textLength="1152.30" lengthAdjust="spacingAndGlyphs">     %%=     -%%:  ,#%%: :===%%#==-  +%@@%@@%#;     ;%%~    ;%%+    +%%; *%*  =%%%+              *%%=======  %%%%%%%#-,  ;*%@@%%@%*  -==%%%===, ,%%- ,%%%%; =%%,   ,%%*</text>
  </g>
  </g>

  <g id="scan" style="animation:scan 16s steps(167) infinite, scanFade 16s linear infinite">
    <rect x="30" y="64" width="11.73" height="130.00" fill="#2dd4bf" fill-opacity="0.07"/>
    <rect x="30" y="64" width="1.4" height="130.00" fill="#7ff5e4" fill-opacity="0.7"/>
  </g>

  <rect x="30" y="64" width="1152.30" height="130.00" fill="url(#scanlines)"/>

  <line x1="30" y1="228.00" x2="1182.30" y2="228.00" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="1"/>

  <text class="prompt" x="30" y="233.20">$ whoami</text>
  <rect id="caretBar" x="97.4" y="222.00" width="7.5" height="13.5" fill="#5eead4" fill-opacity="0.85" style="animation:caretBlink 1.15s step-end infinite"/>
  <text class="info" x="44" y="254.20" style="animation:i0 16s linear infinite">Computer Engineering Student at Telkom University</text>
  <text class="info" x="44" y="275.20" style="animation:i1 16s linear infinite">AI / Robotics / Embedded Systems / Game Dev</text>
  <text class="info" x="44" y="296.20" style="animation:i2 16s linear infinite">masih belajar</text>
</svg>
