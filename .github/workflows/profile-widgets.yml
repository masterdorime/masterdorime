name: Refresh profile widgets

# Regenerates data/profile-data.json, assets/avatar.png and the widgets/*.svg
# panels, then commits only when the rendered output actually changed.
#
# This is now the repository's ONLY scheduled job: it replaced both the GitSkins
# widgets and the third-party 3D contribution action.
#
# Commit cadence, stated honestly: the PROJECTS panel shows relative ages
# ("updated 4d ago"), which are recomputed against the snapshot date, so the
# rendered bytes usually DO change once a day even when no repository was pushed.
# The guard below therefore suppresses duplicate commits within a day (and any
# run where the output is genuinely identical), rather than promising one commit
# per data change. Re-rendering without that guard would add a redundant commit
# on every manual dispatch.

on:
  schedule:
    # 06:12 UTC daily.
    - cron: "12 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A slow run must not overlap the next scheduled one and race on a push.
  group: refresh-profile-widgets
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh the data snapshot
        env:
          # gh reads GH_TOKEN for both REST and GraphQL.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node widgets-pipeline/fetch-data.js

      - name: Render every widget
        run: node widgets-pipeline/build-all.js

      - name: Verify the output
        run: node --test widgets-pipeline/test/*.test.js

      - name: Commit only real changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/profile-data.json widgets assets
          if git diff --cached --quiet; then
            echo "No change since the last run; nothing to commit."
          else
            git commit -m "Update profile widgets"
            git push
          fi
